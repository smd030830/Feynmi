# 로컬 개발: docker compose up
# GCS와 Firebase는 개발용 버킷/프로젝트를 쓴다 (architecture.md 11.2). 해당 설정은 기능이 생길 때 추가한다.
services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: feynmi
      POSTGRES_PASSWORD: feynmi
      POSTGRES_DB: feynmi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 디렉터리를 만든다 (…/data가 아니다)
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feynmi -d feynmi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: apps/backend
      target: dev
    # 기동할 때 마이그레이션을 적용한다.
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://feynmi:feynmi@db:5432/feynmi
      CORS_ORIGINS: http://localhost:3000
      # 저장소 루트의 .env 또는 셸 환경변수에서 읽는다. 프론트엔드의 NEXT_PUBLIC_FIREBASE_PROJECT_ID와 같은 값
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-trixie-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      # 호스트의 node_modules, .next와 섞이지 않게 컨테이너 전용 볼륨을 쓴다
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  db_data:
  frontend_node_modules:
  frontend_next:
